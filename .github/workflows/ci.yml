name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shock
          POSTGRES_PASSWORD: shock
          # Must end in _test: the API test setup refuses to reset any other database
          POSTGRES_DB: shock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shock -d shock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shock:shock@localhost:5432/shock_test
      DISABLE_SCHEDULER: "1"

    steps:
      - uses: actions/checkout@v4

      # pnpm 9, version read from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @shock/api exec prisma generate

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build web
        run: pnpm --filter @shock/web build

      # End-to-end accessibility: spin with a fixed seed, open the drawer, fail on serious/critical axe violations.
      # The API tests reset shock_test, so seed it again for the running app.
      - name: Seed database for e2e
        run: pnpm db:seed

      - name: Install Playwright Chromium
        run: pnpm --filter @shock/web exec playwright install --with-deps chromium

      - name: Accessibility e2e (Playwright + axe)
        run: pnpm --filter @shock/web e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
